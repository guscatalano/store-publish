name: Publish to Microsoft Store

# Reusable workflow: submit an app package + listing-as-code to the Microsoft Store.
#
# The caller repo owns:
#   - store/listing.en-us.json (+ optional listing.<locale>.json) — the managed listing text
#   - store/screenshots/*.png (optional) — if present, replaces every locale's screenshot set;
#     if absent, the screenshots already in Partner Center are left untouched
#   - a job that builds the UNSIGNED msix/appx/msixupload and uploads it as an artifact
#
# This workflow then: downloads the package artifact, creates a pending draft submission
# with the package (no commit), merges the caller's listing-as-code into the draft,
# injects screenshots into the submission zip if the caller has any, and commits the
# submission into certification.
#
# Flow and scripts proven on findneedle (product 9NWLTBV4NRDL) — see scripts/*.ps1.

on:
  workflow_call:
    inputs:
      product-id:
        description: 'Microsoft Store product ID (e.g. 9NWLTBV4NRDL)'
        required: true
        type: string
      package-artifact:
        description: 'Name of the uploaded artifact containing the unsigned .msix/.appx/.msixupload'
        required: true
        type: string
      listing-dir:
        description: 'Directory in the caller repo holding listing.*.json (+ screenshots/)'
        required: false
        type: string
        default: 'store'
      release-notes:
        description: 'Override ReleaseNotes; default is "Version <pkg version>. <ReleaseNotes from listing.en-us.json>"'
        required: false
        type: string
        default: ''
    secrets:
      STORE_TENANT_ID:
        required: true
      STORE_CLIENT_ID:
        required: true
      STORE_CLIENT_SECRET:
        required: true
      STORE_SELLER_ID:
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout caller repo (for listing-as-code)
        uses: actions/checkout@v4

      - name: Checkout store-publish scripts
        uses: actions/checkout@v4
        with:
          repository: guscatalano/store-publish
          path: .store-publish

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package-artifact }}
          path: pkg

      - name: Set up Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Store credentials
        run: msstore reconfigure --tenantId ${{ secrets.STORE_TENANT_ID }} --clientId ${{ secrets.STORE_CLIENT_ID }} --clientSecret ${{ secrets.STORE_CLIENT_SECRET }} --sellerId ${{ secrets.STORE_SELLER_ID }}

      - name: Publish package + listing-as-code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $productId = '${{ inputs.product-id }}'
          $listingDir = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.listing-dir }}'
          if (-not (Test-Path (Join-Path $listingDir 'listing.en-us.json'))) {
            throw "No listing.en-us.json in $listingDir - listing-as-code is required by this pipeline."
          }

          $pkg = Get-ChildItem -Recurse pkg -Include *.msix,*.appx,*.msixupload -File | Select-Object -First 1
          if (-not $pkg) { throw "No .msix/.appx/.msixupload found in artifact '${{ inputs.package-artifact }}'" }
          Write-Host "Package: $($pkg.FullName)"

          # 1) Create/refresh the pending draft with the package, but DON'T commit yet.
          msstore publish $pkg.FullName -id $productId --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish (draft) failed ($LASTEXITCODE)" }

          # 2) Pull the pending draft, merge listing-as-code (all locales) + screenshot refs.
          msstore submission get $productId | Out-File -Encoding utf8 raw.txt
          $notes = '${{ inputs.release-notes }}'
          if (-not $notes) {
            $ver = [regex]::Match($pkg.Name, '(\d+\.\d+\.\d+(\.\d+)?)').Value
            $baseNotes = (Get-Content -Raw (Join-Path $listingDir 'listing.en-us.json') | ConvertFrom-Json).ReleaseNotes
            $notes = if ($ver) { "Version $ver. $baseNotes" } else { $baseNotes }
          }
          ./.store-publish/scripts/Build-Submission.ps1 `
            -CurrentSubmission raw.txt `
            -ListingDir $listingDir `
            -ScreenshotDir (Join-Path $listingDir 'screenshots') `
            -OutFile product.json `
            -ScreenshotManifest manifest.txt `
            -ReleaseNotes $notes

          # 2b) Upload screenshots INTO the submission zip (GET zip, add images, PUT back) BEFORE
          # the metadata update — the Store legacy API keeps packages + images in one zip. No-op
          # when the caller repo has no store/screenshots (existing Partner Center images stay).
          ./.store-publish/scripts/Upload-Screenshots.ps1 -CurrentSubmission raw.txt -ScreenshotManifest manifest.txt

          # `submission update` takes the JSON *content* as the argument, NOT a file path.
          $productJson = Get-Content -Raw product.json
          msstore submission update $productId $productJson
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed ($LASTEXITCODE)" }

          # 3) Commit the submission (package + listing) into certification.
          msstore submission publish $productId
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed ($LASTEXITCODE)" }
